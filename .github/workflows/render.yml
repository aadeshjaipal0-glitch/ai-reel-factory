name: Reel Factory Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Test Python
        run: |
          echo "REEL FACTORY RENDER WORKER ONLINE"
          python --version

      - name: Test FFmpeg
        run: |
          ffmpeg -version
