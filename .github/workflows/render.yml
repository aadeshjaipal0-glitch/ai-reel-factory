name: Reel Factory Render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render test reel
        run: |
          python renderer/render.py

      - name: Verify output
        run: |
          ls -lh reel_01_test.mp4
          ffprobe -v error \
            -show_entries stream=width,height,duration \
            -of default=noprint_wrappers=1 \
            reel_01_test.mp4

      - name: Upload rendered reel
        uses: actions/upload-artifact@v4
        with:
          name: reel-01-test
          path: reel_01_test.mp4
